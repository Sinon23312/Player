<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090212">
  <title>YONETE — Music makes it better</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene">
    <div class="ambient"></div>

    <a class="corner-logo" href="#" aria-label="YONETE home">
      <span class="corner-crown">♛</span>
      <span>YONETE</span>
    </a>

    <header class="hero">
      <div class="hero-crown">♛</div>
      <h1>YONETE</h1>
      <div class="hero-spark">✦</div>
      <p>MUSIC MAKES IT BETTER <b>♡</b></p>
    </header>

    <div class="music-doodle doodle-left">♫</div>
    <div class="music-doodle doodle-top">♫</div>
    <div class="side-slogan">GOOD<br>MUSIC<br>BETTER<br>VIBES ♡</div>

    <section class="player panel" aria-label="Music player">
      <div class="cover-frame">
        <img src="cover-art.jpg" alt="YONETE cover art" class="cover-image">
      </div>

      <div class="player-main">
        <div class="player-actions">
          <button class="pill active" id="shuffleBtn" type="button" title="Shuffle">⤨ <span>Shuffle</span></button>
          <button class="pill" id="repeatBtn" type="button" title="Repeat">⟳ <span>Repeat</span></button>
          <button class="pill list-toggle" id="listToggle" type="button" title="Playlist">☷</button>
        </div>

        <div class="track-heading">
          <h2 id="trackTitle">YONETE VIBES</h2>
          <p id="trackArtist">YONETE</p>
        </div>

        <div class="timeline">
          <input id="seek" type="range" min="0" max="100" value="0" aria-label="Track progress">
          <div class="time-labels"><span id="currentTime">00:00</span><span id="duration">00:00</span></div>
        </div>

        <div class="transport">
          <button class="transport-btn mode" id="shuffleIcon" aria-label="Shuffle" type="button">⤨</button>
          <button class="transport-btn" id="prevBtn" aria-label="Previous track" type="button">|◀</button>
          <button class="play-button" id="playBtn" aria-label="Play" type="button"><span id="playGlyph">▶</span></button>
          <button class="transport-btn" id="nextBtn" aria-label="Next track" type="button">▶|</button>
          <button class="transport-btn mode" id="repeatIcon" aria-label="Repeat" type="button">⟳</button>
        </div>

        <div class="volume-row">
          <span>◖))</span>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.7" aria-label="Volume">
          <span>◖))</span>
        </div>
        <p class="status" id="status" aria-live="polite">Se încarcă playlistul...</p>
      </div>
    </section>

    <aside class="playlist panel" id="playlistPanel">
      <div class="playlist-heading"><span class="note-icon">♫</span><h2>Playlist <small id="trackCount">(0)</small></h2></div>
      <div class="track-list" id="trackList">
        <div class="empty-state">Se caută piesele din folderul <b>piese</b>...</div>
      </div>
    </aside>

    <audio id="audio" preload="metadata"></audio>
  </main>
  <script src="script.js"></script>
</body>
</html>
